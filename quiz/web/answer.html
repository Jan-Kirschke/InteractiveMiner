<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d33">
<title>The Lifelong Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;800&display=swap">
<style>
:root {
  --stage: #0b0d33; --stage-2: #1a1f6b; --ink: #fff; --dim: #b0b5de; --gold: #ffd23f;
  --good: #2ee59d; --bad: #ff5a5f;
  --o1: #ff4d6d; --o2: #3a86ff; --o3: #ff9f1c; --o4: #14c9a8;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 60% at 50% 0%, var(--stage-2), var(--stage) 70%) fixed, var(--stage);
  color: var(--ink); font: 600 17px/1.35 var(--body);
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 400 22px/1 var(--display); color: var(--gold); letter-spacing: .02em; }
.me { text-align: right; font-size: 14px; color: var(--dim); min-width: 0; }
.me b { color: var(--ink); display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { display: grid; gap: 12px; }
.meta { display: flex; justify-content: space-between; font: 800 13px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 5px; transform-origin: left; }
.bar.urgent i { background: var(--bad); }
h1 { font: 400 clamp(26px, 7.4vw, 36px)/1.08 var(--display); margin: 4px 0 0; letter-spacing: .01em; text-wrap: balance; }
.opts { display: grid; gap: 12px; margin-top: 4px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 12px 16px;
  border: 0; border-radius: 18px; color: #fff; text-align: left; font: 800 21px/1.15 var(--body); cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.28); transition: transform .08s, opacity .2s, box-shadow .08s;
}
.opt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.opt:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.opt .k { flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.92); color: #111122;
  display: grid; place-items: center; font: 400 26px/1 var(--display); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt .tag { margin-left: auto; flex: none; font: 800 12px/1 var(--body); letter-spacing: .12em; padding: 7px 9px; border-radius: 99px; background: #fff; color: #111122; }
.o1 { background: var(--o1); } .o2 { background: var(--o2); } .o3 { background: var(--o3); } .o4 { background: var(--o4); }
.opt.dim { opacity: .35; }
.opt.picked { outline: 4px solid #fff; outline-offset: 2px; }
.opt.right { outline: 4px solid var(--good); outline-offset: 2px; opacity: 1; }
.opt[disabled] { cursor: default; }
.panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 18px; display: grid; gap: 10px; }
.big { font: 400 54px/1 var(--display); color: var(--gold); letter-spacing: .04em; }
.code { font: 400 64px/1 var(--display); letter-spacing: .12em; color: var(--gold); text-align: center; }
.cmd { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.cmd code { font: 800 22px/1 ui-monospace, Consolas, monospace; background: #fff; color: #111122; padding: 10px 14px; border-radius: 10px; }
button.copy { font: 800 15px/1 var(--body); padding: 12px 16px; border-radius: 10px; border: 0; background: var(--gold); color: #111122; cursor: pointer; }
p { margin: 0; color: var(--dim); }
.result { font: 400 34px/1 var(--display); text-align: center; padding: 6px 0; }
.result.good { color: var(--good); } .result.bad { color: var(--bad); }
.status { text-align: center; font-size: 14px; color: var(--dim); min-height: 1.3em; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">THE LIFELONG QUIZ</div>
  <div class="me" id="me"></div>
</header>

<section id="link" class="panel" hidden>
  <p><b style="color:#fff">Link your YouTube name once.</b> Type this in the live chat of the stream:</p>
  <div class="cmd"><code id="cmd">!link ------</code><button class="copy" id="copy" type="button">Copy</button></div>
  <p>This page then plays as you. Your answers stay secret and count the moment you tap.</p>
  <p class="status" id="linkStatus">Waiting for your message in chat...</p>
</section>

<main id="game" hidden>
  <div class="meta"><span id="where">-</span><span id="count"></span></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <h1 id="title">Waiting for the next question...</h1>
  <div class="result" id="result" hidden></div>
  <div class="opts" id="opts"></div>
  <p class="status" id="status"></p>
</main>

<script>
const OPT = ["o1", "o2", "o3", "o4"];
const $ = (id) => document.getElementById(id);
let token = null, me = { name: null }, st = null, stAt = 0, picked = null, pickedFor = "", lastPhase = "";

function load() { try { return localStorage.getItem("lq_token"); } catch { return null; } }
function save(t) { try { localStorage.setItem("lq_token", t); } catch {} }
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

async function session() {
  const s = await post("/api/session", { token: load() });
  token = s.token; save(token); me = s;
  render();
}

function roundKey(s) { return `${s.match}-${s.q}-${s.phase === "LOBBY" ? "vote" : "q"}`; }

async function tap(i) {
  if (!st) return;
  const key = roundKey(st);
  const open = st.phase === "ASKING" || st.phase === "LOCKING" || st.phase === "LOBBY";
  if (!open) return;
  picked = i; pickedFor = key;
  if (navigator.vibrate) navigator.vibrate(25);
  render();
  try {
    const r = await post("/api/answer", { token, choice: i + 1 });
    $("status").textContent = r.ok ? (st.phase === "LOBBY" ? "Vote counted" : "Locked in. You can change it until time is up.") : "Not linked yet";
  } catch { $("status").textContent = "No connection, tap again"; }
}

function render() {
  const linked = !!me.name;
  $("link").hidden = linked; $("game").hidden = !linked;
  if (!linked) {
    $("cmd").textContent = "!link " + (me.code || "------");
    $("me").textContent = "";
    return;
  }
  $("me").innerHTML = `<b></b>${me.points != null ? `${me.points} pts · #${me.rank}` : "this match"}`;
  $("me").querySelector("b").textContent = me.name;
  if (!st) return;
  const key = roundKey(st);
  if (pickedFor !== key) picked = null;
  const ph = st.phase;
  $("where").textContent = ph === "LOBBY" ? `Match ${st.match} · vote` : st.q ? `Question ${st.q} of ${st.of} · ${st.category || ""}` : "";
  $("count").textContent = st.answers ? `${st.answers} locked in` : "";
  $("result").hidden = true;

  let opts = [];
  if (ph === "LOBBY" && st.vote) {
    $("title").textContent = "Vote for the next category";
    opts = Object.values(st.vote);
  } else if (st.options && (ph === "ASKING" || ph === "LOCKING" || ph === "REVEALING")) {
    $("title").textContent = st.question;
    opts = st.options;
  } else {
    $("title").textContent = ph === "PODIUM" ? "Match over. Next one starts soon!" : "Get ready...";
  }
  if (ph === "REVEALING" && picked != null && st.correct != null) {
    const ok = picked === st.correct;
    $("result").hidden = false;
    $("result").className = "result " + (ok ? "good" : "bad");
    $("result").textContent = ok ? "Correct!" : "Not this time";
  } else if (ph === "REVEALING") {
    $("result").hidden = false; $("result").className = "result"; $("result").textContent = "The answer";
  }
  const box = $("opts");
  box.replaceChildren(...opts.map((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `opt ${OPT[i]}`;
    const closed = ph === "REVEALING" || ph === "PODIUM";
    b.disabled = closed;
    if (picked === i) b.classList.add("picked");
    if (ph === "REVEALING" && st.correct != null) b.classList.add(i === st.correct ? "right" : "dim");
    else if (picked != null && picked !== i) b.classList.add("dim");
    b.innerHTML = `<span class="k">${i + 1}</span><span class="t"></span>`;
    b.querySelector(".t").textContent = text;
    if (picked === i && !closed) b.insertAdjacentHTML("beforeend", '<span class="tag">LOCKED</span>');
    b.addEventListener("click", () => tap(i));
    return b;
  }));
  if (ph !== lastPhase) { $("status").textContent = ""; lastPhase = ph; }
}

function tick() {
  if (st) {
    const left = Math.max(0, st.remaining - (performance.now() - stAt) / 1000);
    const frac = st.duration ? left / st.duration : 0;
    $("fill").style.transform = `scaleX(${frac})`;
    $("bar").classList.toggle("urgent", st.phase === "ASKING" && left <= 5);
  }
  requestAnimationFrame(tick);
}

let busy = false;
async function poll() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const s = await r.json();
    const phaseChanged = !st || s.phase !== st.phase || s.q !== st.q;
    st = s; stAt = performance.now();
    if (!me.name || phaseChanged) me = await post("/api/me", { token });
    render();
  } catch {}
  busy = false;
}

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("cmd").textContent); $("copy").textContent = "Copied"; }
  catch { getSelection().selectAllChildren($("cmd")); }
});

session().then(() => { setInterval(poll, 600); poll(); requestAnimationFrame(tick); });
</script>
</body>
</html>
